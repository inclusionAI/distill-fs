[package]
name = "distill_fs"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "A read-only FUSE filesystem with lazy loading and chunk deduplication"
repository = "https://github.com/akernel-dev/distill-fs"
readme = "README.md"
keywords = ["fuse", "filesystem", "nydus", "deduplication", "cache"]
categories = ["filesystem", "caching"]

[dependencies]
async-trait = "0.1.89"
anyhow = "1.0.100"
blake3 = "=1.8.2"
bytemuck = { version = "1.24", features = ["derive"] }
clap = { version = "4.5.48", features = ["derive"] }
daemonize = "0.5.0"
fuse-backend-rs = "0.13.0"
heed = "0.22"
heed-types = "0.21"
hex = "0.4"
lazy_static = "1.5.0"
libc = "0.2"
num-traits = "0.2.19"
rand = "0.8.5"
redis = { version = "0.27", features = ["tokio-comp"] }
nydus-api = { git = "https://github.com/dragonflyoss/nydus.git", rev = "5a9d42d8b5cae5052b678ce324d79098f8ae19c1" }
nydus-rafs = { git = "https://github.com/dragonflyoss/nydus.git", rev = "5a9d42d8b5cae5052b678ce324d79098f8ae19c1" }
nydus-storage = { git = "https://github.com/dragonflyoss/nydus.git", rev = "5a9d42d8b5cae5052b678ce324d79098f8ae19c1", features = ["backend-localfs", "backend-oss", "backend-registry", "backend-http-proxy", "backend-s3"] }
nydus-utils = { git = "https://github.com/dragonflyoss/nydus.git", rev = "5a9d42d8b5cae5052b678ce324d79098f8ae19c1" }
opentelemetry = { version = "0.24", features = ["metrics"] }
opentelemetry_sdk = { version = "0.24", features = ["metrics", "rt-tokio-current-thread"] }
opentelemetry-otlp = { version = "0.17", features = ["metrics", "grpc-tonic"] }
serde_json = "1.0.145"
sha2 = "0.10"
signal = "0.7.0"
tempfile = "3.23.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-appender = "0.2"
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }

[features]
default = []
redis-integration-tests = []

[dev-dependencies]
tempfile = "3.23.0"
