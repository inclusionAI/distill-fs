name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            nydus_sha256: e4f7de672ced6031c13c3c38a599993f8a8103b0cf85f9b0783f5f5fa7c8b3dc
            rust_target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            nydus_sha256: dcc43724cc5c4632ed111be3d09f6ee3b063f1e291a750fd7cf71c910e6b78ce
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          with open("Cargo.toml", "rb") as source:
              version = tomllib.load(source)["package"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-rc\.[0-9]+)?", tag):
              raise SystemExit(f"invalid release tag: {tag}")
          if tag != f"v{version}":
              raise SystemExit("tag must match Cargo.toml")
          PY
          git merge-base --is-ancestor HEAD origin/main
      - name: Check formatting, build, and test musl binary
        run: docker build --platform linux/${{ matrix.arch }} --target test -f ci/release.Dockerfile -t distill-fs-static-test:${{ matrix.arch }} .
      - name: Test raw and Nydus FUSE mounts
        run: |
          sudo modprobe fuse
          test -c /dev/fuse
          mkdir -p target/release-test-tools
          curl -fSL --retry 5 \
            https://github.com/dragonflyoss/nydus/releases/download/v2.4.0/nydus-static-v2.4.0-linux-${{ matrix.arch }}.tgz \
            -o target/release-test-tools/nydus.tgz
          echo "${{ matrix.nydus_sha256 }}  target/release-test-tools/nydus.tgz" | sha256sum -c -
          tar -xzf target/release-test-tools/nydus.tgz -C target/release-test-tools
          docker run --rm --device /dev/fuse --cap-add SYS_ADMIN \
            --security-opt apparmor=unconfined --network none \
            -v "$PWD/target/release-test-tools/nydus-static:/nydus:ro" \
            -e DISTILL_FS_NYDUS_IMAGE=/nydus/nydus-image \
            distill-fs-static-test:${{ matrix.arch }} cargo test --locked --release \
            --target ${{ matrix.rust_target }} --test mount -- --ignored
      - name: Build release archive and verify static executable
        run: |
          docker build --platform linux/${{ matrix.arch }} -f ci/release.Dockerfile \
            --build-arg "SOURCE_REVISION=$(git rev-parse HEAD)" \
            --output type=local,dest=dist .
          cd dist
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distill-fs-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: distill-fs-linux-*
          path: dist
      - name: Publish tested bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          test -f distill-fs-linux-amd64/SHA256SUMS
          test -f distill-fs-linux-arm64/SHA256SUMS
          for arch in amd64 arm64; do
            (cd "distill-fs-linux-${arch}" && sha256sum -c SHA256SUMS)
            case "$arch" in
              amd64) target=x86_64-unknown-linux-musl ;;
              arm64) target=aarch64-unknown-linux-musl ;;
            esac
            python3 - "distill-fs-linux-${arch}" "$RELEASE_TAG" "$GITHUB_SHA" "$arch" "$target" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          import tarfile

          directory, tag, revision, arch, target = sys.argv[1:]
          directory = Path(directory)
          archive = directory / f"distill-fs-{tag}-linux-{arch}.tar.gz"
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          if (directory / "SHA256SUMS").read_text() != f"{digest}  {archive.name}\n":
              raise SystemExit(f"unexpected checksum file for {arch}")
          with tarfile.open(archive, "r:gz") as bundle:
              if bundle.getnames() != ["distill_fs", "manifest.json", "LICENSE", "NOTICE", "Cargo.lock"]:
                  raise SystemExit(f"unexpected archive contents for {arch}")
              manifest = json.load(bundle.extractfile("manifest.json"))
              binary_digest = hashlib.sha256(bundle.extractfile("distill_fs").read()).hexdigest()
          expected_manifest = {
              "component": "distill-fs",
              "version": tag.removeprefix("v"),
              "release_tag": tag,
              "source_revision": revision,
              "repository": "inclusionAI/distill-fs",
              "target": target,
              "binary_sha256": binary_digest,
          }
          if manifest != expected_manifest:
              raise SystemExit(f"unexpected release manifest for {arch}")
          PY
          done
          cat distill-fs-linux-{amd64,arm64}/SHA256SUMS > SHA256SUMS
          for arch in amd64 arm64; do
            mv "distill-fs-linux-${arch}/distill-fs-${RELEASE_TAG}-linux-${arch}.tar.gz" .
          done
          sha256sum -c SHA256SUMS
          prerelease=()
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "distill-fs $RELEASE_TAG" --generate-notes \
            "${prerelease[@]}" distill-fs-*.tar.gz SHA256SUMS
